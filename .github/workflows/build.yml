name: Build

on:
  workflow_call:
    inputs:
      environment:
        description: "Select the environment preview or production"
        required: true
        type: string
        default: "preview"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git author for Vercel
        run: |
          git config --global user.name "andante-ray0s-7071"
          git config --global user.email "andante-ray.0s@icloud.com"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build & Deploy Project Artifacts to Preview
        if: ${{ inputs.environment == 'preview' }}
        run: |
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
          url="$(vercel deploy --prebuilt --yes \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_TEAM_SLUG }})"
          vercel alias --token=${{ secrets.VERCEL_TOKEN }} set "$url" dev.tj-renovatie.nl
          echo "Deployed to URL: $url"

      - name: Deploy Project Artifacts to Production
        if: ${{ inputs.environment == 'production' }}
        run: |
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          vercel alias --token=${{ secrets.VERCEL_TOKEN }} set "$url" tj-renovatie.nl
          echo "Deployed to URL: $url"
