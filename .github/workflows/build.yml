name: Build

on:
  workflow_call:
    inputs:
      environment:
        description: "Select the environment preview or production"
        required: true
        type: string
        default: "preview"
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_ORG_ID:
        required: true
      DATABASE_URL:
        required: false
      POSTGRES_URL:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      VERCEL_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git author for Vercel
        run: |
          git config --global user.name "tjrenovatie"
          git config --global user.email "info@tj-renovatie.nl"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }}

      - name: Pull migration environment variables
        run: vercel env pull .env.migrate.local --yes --environment=${{ inputs.environment }} --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }}

      - name: Prepare database migration environment
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
        run: |
          touch .env.migrate.local

          has_valid_database_url() {
            node --env-file="$1" -e "const raw = process.env.DATABASE_URL?.trim() || process.env.POSTGRES_URL?.trim(); if (!raw) process.exit(1); const url = raw.replace(/^(DATABASE_URL|POSTGRES_URL)=/, '').replace(/^[\"']|[\"']$/g, '').trim(); try { const parsed = new URL(url); process.exit(['postgres:', 'postgresql:'].includes(parsed.protocol) ? 0 : 1); } catch { process.exit(1); }" 2>/dev/null
          }

          if has_valid_database_url ".env.migrate.local"; then
            echo "Using database URL from .env.migrate.local."
          elif [ -f ".vercel/.env.${{ inputs.environment }}.local" ] && has_valid_database_url ".vercel/.env.${{ inputs.environment }}.local"; then
            cp ".vercel/.env.${{ inputs.environment }}.local" ".env.migrate.local"
            echo "Using database URL from .vercel/.env.${{ inputs.environment }}.local."
          elif [ -n "${MIGRATION_DATABASE_URL}" ]; then
            printf "\nDATABASE_URL=%s\n" "${MIGRATION_DATABASE_URL}" >> .env.migrate.local
            echo "Using database URL from the GitHub ${{ inputs.environment }} environment DATABASE_URL secret."
          elif [ -n "${MIGRATION_POSTGRES_URL}" ]; then
            printf "\nPOSTGRES_URL=%s\n" "${MIGRATION_POSTGRES_URL}" >> .env.migrate.local
            echo "Using database URL from the GitHub ${{ inputs.environment }} environment POSTGRES_URL secret."
          else
            echo "DATABASE_URL or POSTGRES_URL is missing or empty in the pulled Vercel env files and GitHub ${{ inputs.environment }} environment secrets."
            echo "Add POSTGRES_URL or DATABASE_URL to GitHub Settings > Environments > ${{ inputs.environment }} > Environment secrets, or make sure Vercel exposes the variable to the ${{ inputs.environment }} environment."
            exit 1
          fi

      - name: Validate database migration environment
        run: |
          if ! node --env-file=.env.migrate.local -e "const raw = process.env.DATABASE_URL?.trim() || process.env.POSTGRES_URL?.trim(); if (!raw) process.exit(1); const url = raw.replace(/^(DATABASE_URL|POSTGRES_URL)=/, '').replace(/^[\"']|[\"']$/g, '').trim(); try { const parsed = new URL(url); process.exit(['postgres:', 'postgresql:'].includes(parsed.protocol) ? 0 : 1); } catch { process.exit(1); }"; then
            echo "DATABASE_URL or POSTGRES_URL is missing, empty, or not a valid Postgres URL in the prepared migration environment."
            exit 1
          fi

      - name: Run database migrations
        run: node --env-file=.env.migrate.local scripts/migrate-db.mjs

      - name: Debug – List Vercel domains for this scope
        run: |
          echo "Listing domains for scope: ${{ secrets.VERCEL_ORG_ID }}"
          vercel domains ls \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }}

      - name: Debug – List Vercel projects for this scope
        run: |
          vercel projects ls \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }}

      - name: Build & Deploy Project Artifacts to Preview
        if: ${{ inputs.environment == 'preview' }}
        run: |
          vercel build --target=preview --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }}
          url="$(vercel deploy --prebuilt --yes \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }})"
          echo "Deploying to URL: $url"
          vercel alias --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} set "$url" dev.tj-renovatie.nl
          echo "Deployed to URL: $url"

      - name: Deploy Project Artifacts to Production
        if: ${{ inputs.environment == 'production' }}
        run: |
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }}
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }})"
          vercel alias --token=${{ secrets.VERCEL_TOKEN }} --scope=${{ secrets.VERCEL_ORG_ID }} set "$url" tj-renovatie.nl
          echo "Deployed to URL: $url"
