name: Deploy Preview

# Any branch except main deploys to a Vercel preview environment.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

# Only keep the latest deploy per branch running.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  PREVIEW_ALIAS: preview.shurmeen.com

jobs:
  deploy-preview:
    name: Build & deploy (preview)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (preview)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Assign preview alias
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" "$PREVIEW_ALIAS" --token=${{ secrets.VERCEL_TOKEN }}
          {
            echo "### ✅ Preview deployed"
            echo ""
            echo "Branch \`${GITHUB_REF_NAME}\`"
            echo ""
            echo "- Deployment: ${{ steps.deploy.outputs.url }}"
            echo "- Alias: https://${PREVIEW_ALIAS}"
          } >> "$GITHUB_STEP_SUMMARY"
